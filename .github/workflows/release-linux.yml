name: Release Linux (x86_64)

# Builds a relocatable x86_64-unknown-linux-gnu tarball (binary + .desktop +
# icon + install.sh) and attaches it to the tag's GitHub Release.
#
# Pinned to ubuntu-22.04 rather than ubuntu-latest on purpose: the produced
# binary is dynamically linked against the runner's glibc, and building on a
# newer image would refuse to start on any older distro.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # required to attach artifacts to a GitHub Release

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # libgtk-3-dev is rfd's GTK3 backend; the rest is what wgpu/winit need
        # to link on X11 and Wayland.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxkbcommon-dev \
            desktop-file-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Validate desktop entry
        run: desktop-file-validate packaging/md_editor.desktop

      - name: Test
        run: cargo test --release

      - name: Build tarball
        run: make dist

      - name: Checksum
        run: cd dist && sha256sum ./*.tar.gz > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: md_editor-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
